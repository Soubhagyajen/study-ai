<!DOCTYPE html>
<html lang="en">
<!-- Head identical to Dashboard but tailored for Vishay -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishay - Gurukul AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { background: '#0a0804', primary: '#c9963a', accent: '#e8732a', text: '#f0ddb0', success: '#2d7a4f', danger: '#c0392b' }, fontFamily: { cinzel: ['Cinzel', 'serif'], garamond: ['EB Garamond', 'serif'], sans: ['DM Sans', 'sans-serif']} } } }
    </script>
    <style>
        body { background-color: #0a0804; color: #f0ddb0; background-image: radial-gradient(circle at top right, rgba(201, 150, 58, 0.15) 0%, transparent 40%), radial-gradient(circle at bottom left, rgba(232, 115, 42, 0.1) 0%, transparent 50%); background-attachment: fixed; }
        .glass { background: rgba(10, 8, 4, 0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(201, 150, 58, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-btn:hover { background: rgba(201, 150, 58, 0.15); border-color: rgba(201, 150, 58, 0.5); transform: translateY(-1px); transition: all 0.3s ease; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex selection:bg-primary/30 text-text overflow-x-hidden flex-col md:flex-row">
    <!-- Mobile Topbar -->
    <div class="md:hidden flex items-center justify-between p-4 glass sticky top-0 z-[60] shadow-md border-b border-primary/20 bg-[#0a0804]">
        <h1 class="font-cinzel text-2xl font-bold text-primary tracking-widest drop-shadow-primary">GURUKUL</h1>
        <button onclick="document.getElementById('mobile-menu').classList.toggle('-translate-x-full')" class="text-primary hover:text-white transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Sidebar -->
        <aside id="mobile-menu" class="w-64 glass border-r border-t-0 border-b-0 border-l-0 flex flex-col fixed md:sticky top-0 left-0 h-screen z-[100] transform -translate-x-full md:translate-x-0 transition-transform duration-300 bg-[#0a0804] md:bg-transparent shadow-[4px_0_24px_rgba(0,0,0,0.8)] md:shadow-none">
        <!-- Close Button (Mobile Only) -->
        <button onclick="document.getElementById('mobile-menu').classList.add('-translate-x-full')" class="md:hidden absolute top-3 md:p-6 right-6 text-text/50 hover:text-danger z-50">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="p-4 md:p-8"><h1 class="font-cinzel text-lg md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent tracking-widest drop-shadow-primary">GURUKUL</h1><p class="font-garamond text-sm text-text/60 mt-1 uppercase tracking-widest">Ancient Wisdom</p></div>
        <nav class="flex-1 px-4 space-y-3 mt-4 text-sm font-sans tracking-wide">
            <a href="gurukul_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text/70 hover:text-primary hover:bg-primary/10 transition-all font-medium border-l-2 border-transparent">Dashboard</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-gradient-to-r from-primary/20 to-transparent border-l-2 border-primary text-primary transition-all font-bold">Vishay</a>
            <a href="gurukul_pariksha.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text/70 hover:text-primary transition-all font-medium border-l-2 border-transparent">Pariksha</a>
            <a href="gurukul_planner.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text/70 hover:text-primary transition-all font-medium border-l-2 border-transparent">Study Planner</a>
        </nav>
        <div class="p-3 md:p-6"><a href="gurukul_ashram.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text/70 hover:text-primary hover:bg-primary/10 transition-all font-medium border border-text/10">Ashram</a></div>
    </aside>

    <main class="flex-1 px-4 md:px-8 py-6 md:py-8 overflow-y-auto overflow-x-hidden w-full">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-3 md:mb-6 md:mb-5 md:mb-10 pb-4 md:pb-6 border-b border-primary/20">
            <div>
                <h2 class="font-cinzel text-xl md:text-4xl font-bold tracking-wide">Vishay (Subjects)</h2>
                <p class="font-garamond text-primary/80 text-xl mt-2 italic">Master your disciplines, one topic at a time.</p>
            </div>
            <div class="flex flex-wrap gap-2 md:gap-3">
                <input type="text" id="new-sub-name" placeholder="New Subject Name" class="bg-black/60 border border-primary/30 rounded-lg px-4 py-2 text-sm text-text focus:outline-none focus:border-primary">
                <button class="glass max-w-full break-words glass-btn px-6 py-2 rounded-lg text-primary font-bold shadow-[0_0_10px_rgba(201,150,58,0.2)]" onclick="addSubject()">+ Add</button>
            </div>
        </header>

        <!-- Subjects Grid -->
        <div class="grid max-w-full grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 md:p-6" id="subjects-container">
            <!-- Template populated by JS -->
            <div class="glass max-w-full break-words rounded-xl p-3 md:p-6 border-t-4 border-t-accent text-center text-text/50">
                Click "Fetch via API" to load your curriculum natively from Django backend.
            </div>
        </div>
    </main>

    <script src='/static/js/gurukul_api.js'></script> 
    <!-- API INTEGRATION SCRIPT -->
    <script>
        async function loadSubjectsAPI() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '<div class="text-center w-full py-10"><p class="animate-pulse text-primary">Loading from Django API (/api/subjects/)...</p></div>';
            
            try {
                // Example Fetch Integration targeting our Django DRF implementation
                // Assumes Authorization header logic applies (Bearer token)
                const token = getToken();
                
                const response = await gurukulFetch('http://127.0.0.1:8000/api/subjects/', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error("API Unauthorized or Offline");
                const subjects = await response.json();
                
                container.innerHTML = subjects.map(sub => `
                    <div class="glass max-w-full break-words rounded-xl p-3 md:p-6 relative group border-t-4" style="border-top-color: ${sub.color_code}">
                        <h3 class="font-cinzel text-xl text-primary font-bold mb-1">${sub.name}</h3>
                        <p class="font-garamond text-sm text-text/70 mb-4 h-10 truncate whitespace-pre-wrap">${sub.description || 'Core philosophy and mechanics.'}</p>
                        
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-xs font-sans text-text/60">${sub.completed_topics} / ${sub.total_topics} Topics Complete</span>
                            <span class="text-lg font-sans font-bold text-accent">${sub.progress_percentage}%</span>
                        </div>
                        <div class="w-full bg-black/50 rounded-full h-1.5 border border-white/5 overflow-hidden mb-3 md:mb-6">
                            <div class="bg-gradient-to-r from-accent to-primary h-full" style="width: ${sub.progress_percentage}%"></div>
                        </div>

                        ${sub.topics.length > 0 ? 
                            sub.topics.slice(0, 4).map(topic => `
                            <div class="flex justify-between items-center mb-2 text-sm p-2 bg-black/30 rounded ${topic.is_completed ? 'border border-success/30' : ''}">
                                <span class="${topic.is_completed ? 'line-through text-text/50' : 'text-white'}">${topic.name}</span>
                                ${!topic.is_completed ? `<button onclick="markComplete(${topic.id})" class="text-xs text-primary hover:text-white transition-colors">Mark Done</button>` : `<span class="text-success text-xs">✓</span>`}
                            </div>
                        `).join('') : '<p class="text-xs text-text/40 italic mb-4">No topics created. Begin setting curriculum below.</p>'}
                        
                        <div class="mt-4 pt-3 border-t border-primary/10 flex gap-2">
                            <input type="text" id="new-topic-${sub.id}" placeholder="New topic..." class="flex-1 bg-black/40 border border-primary/20 rounded px-2 py-1 text-xs text-text focus:outline-none focus:border-primary">
                            <button onclick="addTopic(${sub.id})" class="text-xs bg-primary/20 text-primary border border-primary/50 font-bold px-3 py-1 rounded hover:bg-primary hover:text-black transition-colors">+ Add</button>
                        </div>
                    </div>
                `).join('');
                
            } catch(e) {
                container.innerHTML = `<div class="glass max-w-full break-words border-danger/50 p-3 md:p-6 text-danger col-span-full">Error hitting Django Backend: Ensure you have executed 'python manage.py runserver' inside the activated virtual environment, and authenticated your user.</div>`;
            }
        }

        async function markComplete(topicId) {
            try {
                const token = getToken();
                const res = await gurukulFetch(`http://127.0.0.1:8000/api/topics/${topicId}/mark_completed/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confidence_level: 85 })
                });
                if(res.ok) loadSubjectsAPI();
            } catch(e) { console.error('Error marking complete', e); }
        }

        async function addTopic(subjectId) {
            const topicInput = document.getElementById(`new-topic-${subjectId}`);
            if(!topicInput || !topicInput.value) return;
            try {
                const token = getToken();
                const res = await gurukulFetch('http://127.0.0.1:8000/api/topics/', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: topicInput.value, subject: subjectId, confidence_level: 10 })
                });
                if(res.ok) {
                    topicInput.value = '';
                    loadSubjectsAPI(); // Refresh UI instantly
                }
            } catch(e) { console.error("Error adding topic", e); }
        }

        async function addSubject() {
            const name = document.getElementById('new-sub-name').value;
            if(!name) return;
            try {
                const token = getToken();
                const res = await gurukulFetch('http://127.0.0.1:8000/api/subjects/', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, description: 'Newly added Vishay manual entry.', color_code: '#c9963a'})
                });
                if(res.ok) {
                    document.getElementById('new-sub-name').value = '';
                    loadSubjectsAPI(); // Refresh DOM
                }
            } catch(e) { console.error("Error adding subject", e); }
        }
        document.addEventListener('DOMContentLoaded', loadSubjectsAPI);
    </script>
</body>
</html>
